<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A Website</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JavaScript Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Custom styles for image preview */
        #image-preview img {
            max-height: 200px;
            object-fit: contain;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <!-- Replace 'logo.png' with your actual logo file name -->
                <img src="logo.png" alt="Logo" class="h-10 w-auto">
                <span class="text-xl font-bold text-blue-600">Q&A Hub</span>
            </div>
            <button id="open-modal" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition">
                Ask Question
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-4 py-8">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">Latest Questions</h2>

        <!-- Question Feed -->
        <div id="question-feed" class="space-y-6">
            <!-- Questions will appear here -->
            <div class="text-center py-10 text-gray-500">Loading questions...</div>
        </div>
    </main>

    <!-- Modal for Asking Question -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-20">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 relative">
            <button id="close-modal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <h3 class="text-xl font-bold mb-4">Ask a Question</h3>

            <form id="question-form">
                <textarea
                    id="question-text"
                    rows="4"
                    class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none mb-4"
                    placeholder="What is your question?"
                    required
                ></textarea>

                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Add an image (optional)</label>
                    <input
                        type="file"
                        id="question-image"
                        accept="image/*"
                        class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"
                    >
                </div>

                <!-- Image Preview Area -->
                <div id="image-preview" class="mb-4 hidden">
                    <p class="text-xs text-gray-500 mb-1">Preview:</p>
                    <img src="" alt="Preview" class="rounded-lg border">
                </div>

                <button
                    type="submit"
                    id="submit-btn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition disabled:bg-blue-300"
                >
                    Post Question
                </button>
            </form>
        </div>
    </div>

    <script>
        // --- STEP 1: CONFIGURATION ---
        // Replace these with your own Supabase project details from the Settings > API page
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- UI ELEMENTS ---
        const modal = document.getElementById('modal');
        const openModalBtn = document.getElementById('open-modal');
        const closeModalBtn = document.getElementById('close-modal');
        const questionForm = document.getElementById('question-form');
        const questionInput = document.getElementById('question-text');
        const imageInput = document.getElementById('question-image');
        const imagePreview = document.getElementById('image-preview');
        const previewImg = imagePreview.querySelector('img');
        const submitBtn = document.getElementById('submit-btn');
        const questionFeed = document.getElementById('question-feed');

        // --- FUNCTIONS ---

        // Toggle Modal
        function toggleModal() {
            modal.classList.toggle('hidden');
            if (modal.classList.contains('hidden')) {
                questionForm.reset();
                imagePreview.classList.add('hidden');
            }
        }

        openModalBtn.addEventListener('click', toggleModal);
        closeModalBtn.addEventListener('click', toggleModal);

        // Image Preview Logic
        imageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    imagePreview.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            } else {
                imagePreview.classList.add('hidden');
            }
        });

        // Fetch Questions from Supabase
        async function fetchQuestions() {
            const { data, error } = await _supabase
                .from('questions')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error fetching questions:', error);
                questionFeed.innerHTML = `<p class="text-red-500 text-center">Failed to load questions. Check your Supabase configuration.</p>`;
                return;
            }

            renderQuestions(data);
        }

        // Render Questions to the UI
        function renderQuestions(questions) {
            if (questions.length === 0) {
                questionFeed.innerHTML = `<p class="text-gray-500 text-center">No questions yet. Be the first to ask!</p>`;
                return;
            }

            questionFeed.innerHTML = questions.map(q => `
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-gray-800 text-lg mb-4">${q.content}</p>
                    ${q.image_url ? `<img src="${q.image_url}" class="rounded-lg max-h-96 w-auto mb-4 border" alt="Question Image">` : ''}
                    <div class="text-xs text-gray-400">
                        Posted on ${new Date(q.created_at).toLocaleString()}
                    </div>
                </div>
            `).join('');
        }

        // Handle Form Submission
        questionForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const content = questionInput.value;
            const imageFile = imageInput.files[0];

            submitBtn.disabled = true;
            submitBtn.innerText = 'Posting...';

            let imageUrl = null;

            try {
                // 1. Upload image if exists
                if (imageFile) {
                    const fileName = `${Date.now()}_${imageFile.name}`;
                    const { data: uploadData, error: uploadError } = await _supabase.storage
                        .from('question-images')
                        .upload(fileName, imageFile);

                    if (uploadError) throw uploadError;

                    // Get public URL
                    const { data: publicUrlData } = _supabase.storage
                        .from('question-images')
                        .getPublicUrl(fileName);

                    imageUrl = publicUrlData.publicUrl;
                }

                // 2. Save question to database
                const { error: insertError } = await _supabase
                    .from('questions')
                    .insert([{ content: content, image_url: imageUrl }]);

                if (insertError) throw insertError;

                // Success!
                toggleModal();
                fetchQuestions();
            } catch (err) {
                console.error('Error:', err);
                alert('Something went wrong. Please check your Supabase settings and try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Post Question';
            }
        });

        // Initial fetch
        if (SUPABASE_URL !== 'YOUR_SUPABASE_URL') {
            fetchQuestions();
        } else {
            questionFeed.innerHTML = `<p class="text-amber-600 text-center p-4 bg-amber-50 rounded-lg">Welcome! Please follow the README instructions to connect your Supabase account and see questions here.</p>`;
        }
    </script>
</body>
</html>
